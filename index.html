<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-title" content="Dashboard" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="color-scheme" content="light dark" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<!-- Nur Supabase und die zwei festen CDN-Dateien. Keine fremden Skripte. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; img-src 'self' data:; manifest-src 'self'; connect-src https://jxibletvuuodxvbyjlga.supabase.co wss://jxibletvuuodxvbyjlga.supabase.co; base-uri 'none'; form-action 'none'" />
<title>DropChat Dashboard</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css"
      integrity="sha384-kz+I4+mczbNiZfLAJMxOlJaZmnbRYhARHNkR2k6tal4gz7OL33/0puDD3SvkiNX9" crossorigin="anonymous" />
<style>
  :root {
    --surface-1:      #ffffff;
    --page-plane:     #fbfafe;
    --text-primary:   #1c1917;
    --text-secondary: #57534e;
    --border:         rgba(139, 92, 246, 0.16);
    --shadow:         0 18px 38px rgba(76, 29, 149, 0.08);
    --accent:         #8b5cf6;
    --fehler:         #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface-1:      #17131f;
      --page-plane:     #0d0a13;
      --text-primary:   #fbfafc;
      --text-secondary: #c9c3d6;
      --border:         rgba(167, 139, 250, 0.22);
      --shadow:         0 18px 38px rgba(0, 0, 0, 0.35);
      --fehler:         #f87171;
    }
  }
  body { background: var(--page-plane); color: var(--text-primary); min-height: 100vh; }
  .rahmen { max-width: 420px; margin: 0 auto; padding: 12vh 16px 32px; }
  .karte { background: var(--surface-1); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow); padding: 28px 24px; }
  .marke { font-weight: 700; font-size: 1.35rem; margin-bottom: 4px; }
  .unter { color: var(--text-secondary); margin-bottom: 20px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); }
  .meldung { min-height: 1.4em; margin-top: 12px; color: var(--text-secondary); }
  .meldung.fehler { color: var(--fehler); }
  #code { letter-spacing: 0.4em; font-size: 1.4rem; text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="rahmen">
  <div class="karte">
    <div class="marke">DropChat Dashboard</div>

    <!-- Schritt 1: E-Mail -->
    <section id="schritt-email" hidden>
      <div class="unter">Melde dich mit deiner freigeschalteten E-Mail-Adresse an.</div>
      <label class="form-label" for="email">E-Mail</label>
      <input id="email" class="form-control" type="email" autocomplete="email" inputmode="email" />
      <button id="code-senden" class="btn btn-primary w-100 mt-3" type="button">Code senden</button>
    </section>

    <!-- Schritt 2: Code -->
    <section id="schritt-code" hidden>
      <div class="unter" id="code-hinweis"></div>
      <label class="form-label" for="code">Code aus der E-Mail</label>
      <input id="code" class="form-control" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="10" />
      <button id="code-pruefen" class="btn btn-primary w-100 mt-3" type="button">Anmelden</button>
      <button id="zurueck" class="btn btn-link w-100 mt-1" type="button">Andere E-Mail</button>
    </section>

    <!-- Eingeloggt, aber nicht freigeschaltet -->
    <section id="schritt-kein-zugang" hidden>
      <div class="unter">Diese Adresse ist nicht für das Dashboard freigeschaltet.</div>
      <button id="abmelden-2" class="btn btn-outline-secondary w-100" type="button">Abmelden</button>
    </section>

    <div id="meldung" class="meldung" role="status" aria-live="polite"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0/dist/umd/supabase.js"
        integrity="sha384-faMlYZUtkJj+Sh6Bmu/L0GzPcraRWN6CW+9RH3GUrK/Z0WS9tgaNNt0tHiLxsbdb" crossorigin="anonymous"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
